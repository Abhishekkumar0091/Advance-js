<!DOCTYPE html>
<html>
<head>
    <title>Profile Card Generator</title>
</head>
<body>

<h2>Create Your Profile</h2>

<form id="profileForm">
    <input type="text" id="name" placeholder="Enter Name" required><br><br>
    <input type="text" id="profession" placeholder="Enter Profession" required><br><br>
    <textarea id="bio" placeholder="Enter Bio" required></textarea><br><br>
    <input type="text" id="photo" placeholder="Enter Profile Photo URL" required><br><br>
    <button type="submit">Create Card</button>
</form>

<hr>

<div id="cardContainer"></div>

<script src="script.js"></script>
</body>
</html>
