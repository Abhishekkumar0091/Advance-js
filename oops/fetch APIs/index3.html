<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    form {
      background-color: gray;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: aquamarine;
      padding: 15px;
      border-radius: 6px;
    }

    .card div {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 7px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      color: white;
      background-color: red;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>
  <p id="err-display"></p>
  <form id="formData">
    <h1>Form Validation</h1>
    <div class="card">
      <div>
        <label for="username">Name</label>
        <input type="username" id="username" >
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password">
      </div>

      <button type="submit">Submit</button>

    </div>
  </form>

  <script src="./script1.js"></script>
</body>
</html>
