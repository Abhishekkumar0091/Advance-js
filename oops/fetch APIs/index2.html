<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <div id="cards" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  <script>
fetch("https://randomuser.me/api/?results=3")
      .then(res => res.json())
      .then(data => {
        document.getElementById("cards").innerHTML = data.results.map(user => `
          <div class="bg-white rounded-xl shadow-md p-6 text-center">
            <img src="${user.picture.large}" class="w-24 h-24 rounded-full mx-auto mb-4" />
            <h2 class="text-xl font-semibold">${user.name.first} ${user.name.last}</h2>
            <p class="text-gray-500 text-sm">${user.location.country}</p>
            <p class="text-sm mt-2">${user.email}</p>
            <p class="text-sm text-gray-600 mt-1">Age: ${user.dob.age}</p>
          </div>
        `).join("");
      });
      </script>
</body>
</html>
