<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Admin Interaction</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #postBtn {
            background-color: #007bff;
            color: white;
        }

        #removeBtn {
            background-color: red;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        hr {
            margin: 20px 0;
        }
        .chat {
    max-width: 500px;
    margin: 10px auto;
    padding: 10px;
    border-radius: 8px;
}

.user {
    background: #e3f2fd;
}

.admin {
    background: #ffe0b2;
    font-weight: bold;
}

.time {
    float: right;
    font-size: 12px;
    color: gray;
}
    </style>
</head>

<body>

<div class="container">

    <h2>User Panel</h2>
    <select id="userSelect">
    <option value="u1">Abhi</option>
    <option value="u2">Ankur</option>
    <option value="admin">Admin</option>
</select>

    <input type="text" id="msg" placeholder="Write message as Abhi..." />
    <button id="postBtn">Post Message</button>

    <hr>

    <h2>Admin Panel</h2>
    <button id="removeBtn">Remove All Messages</button>

</div>

<!-- LINK TO YOUR JS FILE -->
<script src="script.js"></script>
</body>
</html>
